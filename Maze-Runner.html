:root{color-scheme:dark;--bg:#050915;--panel:#0b1424;--white:#d3d4ba;--muted:#7f9296;--mint:#90bbad;--red:#aa555d;--gold:#c6b477;--line:#334652;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;height:100%;width:100%;overflow:hidden}body{font:14px/1.85 NightPixel,"Courier New",monospace;color:var(--white);background:var(--bg);text-transform:uppercase}button,input,select{font:inherit;text-transform:uppercase;border-radius:0}button{cursor:pointer;touch-action:manipulation}button:disabled{cursor:default;opacity:.4}button:focus-visible,input:focus-visible{outline:2px solid var(--mint);outline-offset:4px}button,input{-webkit-tap-highlight-color:transparent}h1,h2,h3,p{margin:0;font-weight:400}canvas,img{image-rendering:pixelated}canvas{display:block}a{color:inherit}body::after{content:"";position:fixed;inset:0;z-index:40;pointer-events:none;background:repeating-linear-gradient(0deg,#00000012 0 1px,transparent 1px 4px);opacity:.35}

 function camera(v){
   save.prefs.view=v;if(world)world.firstPerson=v==='3d';document.body.classList.toggle('first-person',v==='3d');dirty=true;persist();updateHud();
 }
 function load(w){world=w;map=A.mapImage(w.map);world.firstPerson=save.prefs.view==='3d';world.explore(world.vision());crouch=world.crouching;scare=null;hurt=0;resize();camera(save.prefs.view);visualSettings();updateHud();}
 function start(s,d,mode,v){
   save.prefs.view=v;run={id:Date.now().toString(36)+'-'+seed().toString(36),seed:s,difficulty:d,mode,elapsed:0,collected:0,chases:0,rewarded:false};
   load(new C.World(s,d));archive();if(!save.tutorial)show('tutorial');else resume();
 }
 function resume(){
   if(!world)return;if(world.phase==='dead'){show('result');return;}if(world.phase==='escaped'){show(run.mode==='descent'&&world.map.floor<3?'chamber':'result');return;}
   scare=null;paused=false;page='game';dirty=true;reset();crouch=world.crouching;document.body.classList.remove('scaring');document.body.classList.add('in-game','playing');$('shell').classList.add('closed');$('world').focus({preventScroll:true});stamp0=performance.now();audio.unlock();updateHud();archive();
 }
 function finish(defer=false){
   if(world.phase==='escaped'&&run.mode==='descent'&&world.map.floor<3){archive();show('chamber');return;}
   if(!run.rewarded&&!save.rewarded.includes(run.id)){
     const alive=world.phase==='escaped',total=run.elapsed+world.time;run.clean=alive&&run.chases+world.chases===0;run.earned=0;run.rewarded=true;
     if(alive){
       run.earned=Math.round(80*world.cfg.reward*(run.mode==='descent'?3.1:1))+Math.max(0,Math.round(20-total/(run.mode==='descent'?70:20)))+(run.clean?15:0);save.coins+=run.earned;save.stats.escapes++;
       if(run.mode==='escape'&&(save.stats.best[world.map.difficulty]===null||total<save.stats.best[world.map.difficulty]))save.stats.best[world.map.difficulty]=total;
     }else save.stats.deaths++;
     save.stats.sigils+=run.collected+world.sigils.length;save.rewarded.push(run.id);save.rewarded=save.rewarded.slice(-40);save.run=null;persist();
   }if(!defer)show('result');
 }
 function nextFloor(){
   if(world.phase!=='escaped'||world.map.floor>=3)return;const old=world,f=old.map.floor+1;
   run.elapsed+=old.time;run.collected+=old.sigils.length;run.chases+=old.chases;
   const w=new C.World((run.seed^Math.imul(f,2654435761))>>>0,old.map.difficulty,f);
   w.player.hp=old.player.hp;w.player.stamina=Math.max(60,old.player.stamina);w.player.stones=Math.min(6,old.player.stones+2);load(w);resume();notify('LEVEL '+(f+1)+' / '+labels[f]+'. YOUR LIGHT IS FADING.');
 }
 function leave(){archive();world=null;run=null;map=null;scare=null;origin='home';show('home');}
 function torch(){if(paused)return;world.torch=!world.torch;notify(world.torch?'TORCH ON. IT CAN SEE YOU MORE EASILY.':'TORCH OFF. KEEP CLOSE TO THE WALLS.');archive();}
 function decoy(){if(!paused&&!world.throwStone())notify('NO STONES. LOOK FOR A SATCHEL.');}
 function interact(){if(!paused){world.firstPerson=save.prefs.view==='3d';world.interact();}}
 function beginScare(){
   const level=world.map.difficulty+world.map.floor*.5;
   scare={t:0,duration:1.05+level*.28,intensity:1+level*.37,fatal:world.phase==='dead'};paused=true;page='scare';reset();$('shell').classList.add('closed');document.body.classList.remove('playing');document.body.classList.add('scaring');audio.ambient(world,false);audio.effect('scare',{level});archive();
 }
 function events(){
   const list=world.events.splice(0);
   for(const ev of list){
     if(ev.kind!=='damage'||ev.source!=='beast')audio.effect(ev.kind,ev);
     if(ev.kind==='key'){notify('KEY '+roman[ev.id]+' FOUND. LOOK FOR VAULT '+roman[ev.id]+'.');archive();}
     if(ev.kind==='relic'){notify('SIGIL '+roman[ev.id]+' RECOVERED. '+ev.total+'/'+world.cfg.seals+' SOCKETS READY.');archive();}
     if(ev.kind==='needKey')notify('VAULT '+roman[ev.id]+' NEEDS KEY '+roman[ev.id]+'.');
     if(ev.kind==='alarm'){hurt=.35;notify(ev.quiet?'THE CHEST RATTLED. IT MAY HAVE HEARD.':'ALARM CHEST. IT HEARD THAT.');archive();}
     if(ev.kind==='bell')notify('THE FLOOR RANG. LEAVE THE SOUND BEHIND.');
     if(ev.kind==='supply'){notify(ev.supply==='stones'?'STONES REPLENISHED.':'MEDICINE RESTORED ONE HEART.');archive();}
     if(ev.kind==='gate'){notify('SIGILS INSERTED. WALK THROUGH THE OPEN EXIT.');archive();}
     if(ev.kind==='locked')notify(ev.missing+' SIGIL'+(ev.missing===1?'':'S')+' STILL MISSING.');
     if(ev.kind==='gateHint')notify(world.sigils.length===world.cfg.seals?'USE INTERACT TO INSERT THE SIGILS.':'THE EXIT IS HERE. ITS SOCKETS ARE EMPTY.');
     if(ev.kind==='nothing')notify('NO CHEST OR EXIT IN REACH.');
     if(ev.kind==='enterGate')notify('THE EXIT IS OPEN. WALK THROUGH IT.');
     if(ev.kind==='exhausted')notify('OUT OF BREATH. WALK OR CROUCH.');
     if(ev.kind==='damage'){if(ev.source==='beast')beginScare();else{hurt=.6;notify('THE SPIKES STRUCK. WATCH FOR THE GLINT.');archive();}}
     if(ev.kind==='death'){run.deathSource=ev.source;finish(!!scare);}
     if(ev.kind==='escape')finish();
   }
 }
 function updateHud(){
   if(!world)return;const p=world.player;
   $('hearts').innerHTML=Array.from({length:3},(_,i)=>'<span class="'+(i>=p.hp?'lost':'')+'">+</span>').join('');$('diff-tag').textContent=world.cfg.name;
   $('stamina').style.width=Math.round(p.stamina)+'%';$('stamina').style.background=p.stamina<22?'#b4746d':'#b2b795';$('stam-text').textContent=Math.round(p.stamina)+'%';$('stance').textContent=p.exhausted?'OUT OF BREATH':world.crouching?'SILENT':p.sprinting?'RUNNING':world.torch?'TORCH ON':'TORCH OFF';
   $('objective-label').textContent=world.gateOpen?'EXIT OPEN':innerWidth<600?(world.sigils.length===world.cfg.seals?'FIND EXIT':'SIGILS'):(world.sigils.length===world.cfg.seals?'FIND THE EXIT':'RECOVER THE SIGILS');
   $('rune-row').innerHTML=Array.from({length:world.cfg.seals},(_,i)=>'<span class="rune '+(world.sigils.includes(i)?'on':world.keys.includes(i)?'key':'')+'" style="'+(world.sigils.includes(i)?'color:'+A.RUNE_COLORS[i]:'')+'" title="'+(world.sigils.includes(i)?'SIGIL ':world.keys.includes(i)?'KEY ':'MISSING ')+roman[i]+'">'+roman[i]+'</span>').join('');
   document.querySelectorAll('.noise i').forEach((el,i)=>el.classList.toggle('on',world.noise*7>i+.2));
   const e=world.enemy,message=world.time<world.cfg.grace?'':e.state==='hunt'?'IT HAS SEEN YOU. BREAK THE SIGHT LINE.':e.state==='investigate'&&world.danger>.35?'SOMETHING IS FOLLOWING THE SOUND.':world.danger>.55?'BREATHING IN THE DARK.':'';
   $('hunt').textContent=message;$('hunt').style.opacity=message?'1':'0';$('timer').textContent=fmt(run.elapsed+world.time);$('floor-tag').textContent='LEVEL 0'+(world.map.floor+1)+(run.mode==='descent'?' / 04':'');$('camera-tag').textContent=save.prefs.view==='3d'?'3D / FIRST PERSON':'2D / TOP DOWN';
   $('inventory').textContent='STONES '+p.stones+' / LIGHT '+(world.torch?'ON':'OFF');$('stone-count').textContent=p.stones;$('touch-stone').disabled=p.stones===0;
   $('touch-torch').classList.toggle('on',world.torch);$('touch-crouch').classList.toggle('on',world.crouching);$('touch-torch').setAttribute('aria-pressed',String(world.torch));$('touch-crouch').setAttribute('aria-pressed',String(world.crouching));
   $('shortcuts').textContent=save.prefs.view==='3d'?'WASD MOVE / DRAG OR ARROWS LOOK / E INTERACT / SHIFT RUN / Q DECOY / C CROUCH / L TORCH':'WASD MOVE / E INTERACT / SHIFT RUN / Q DECOY / C CROUCH / L TORCH / V VIEW';
   world.firstPerson=save.prefs.view==='3d';const target=world.nearby();let prompt='';
   if(target?.kind==='chest')prompt=target.chest.kind==='alarm'?'OPEN UNMARKED CHEST':world.keys.includes(target.chest.id)?'UNLOCK VAULT '+roman[target.chest.id]:'VAULT '+roman[target.chest.id]+' / KEY REQUIRED';
   if(target?.kind==='gate')prompt=world.gateOpen?'WALK THROUGH THE EXIT':world.sigils.length===world.cfg.seals?'INSERT ALL SIGILS':'EXIT / '+(world.cfg.seals-world.sigils.length)+' SIGILS MISSING';
   $('prompt').textContent=(matchMedia('(pointer:coarse)').matches?'INTERACT / ':'E / ')+prompt;$('prompt').style.display=prompt&&!paused?'block':'none';$('touch-interact').classList.toggle('ready',!!target);
 }
 function resize(){
   const maxW=innerWidth<600?240:400,ratio=innerHeight/innerWidth;
   view.w=maxW;view.h=Math.max(150,Math.min(580,Math.round(maxW*ratio)));view.topScale=innerWidth<600?1.16:1.55;
   for(const c of [$('world'),$('menu-art')]){c.width=view.w;c.height=view.h;}ctx.imageSmoothingEnabled=false;mctx.imageSmoothingEnabled=false;dirty=true;if(world)updateHud();

 function loop(stamp){
   const dt=Math.min(.05,Math.max(0,(stamp-stamp0)/1000));stamp0=stamp;time+=dt;
   if(scare){
     scare.t+=dt;
     A.scare(ctx,view.w,view.h,scare.t,scare.intensity,save.prefs.motion,save.prefs.glitch);
     if(scare.t>=scare.duration){const fatal=scare.fatal;scare=null;document.body.classList.remove('scaring');if(fatal)show('result');else{resume();notify('YOU ARE STILL ALIVE. GET AWAY.');}}
     requestAnimationFrame(loop);return;
   }
   if(!world){
     if(dirty||(page==='home'&&save.prefs.motion&&stamp-lastPaint>120)){A.menu(mctx,view.w,view.h,time,save.prefs.motion);dirty=false;lastPaint=stamp;}
   }else{
     if(!paused){
       let x=(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0)+joy.x,y=(keys.has('KeyS')||keys.has('ArrowDown')?1:0)-(keys.has('KeyW')||keys.has('ArrowUp')?1:0)+joy.y;
       if(save.prefs.view==='3d'){
         const turn=(keys.has('ArrowRight')?1:0)-(keys.has('ArrowLeft')?1:0);world.player.angle+=turn*dt*1.85*save.prefs.sensitivity;
         const tilt=(keys.has('PageUp')?1:0)-(keys.has('PageDown')?1:0);world.player.pitch=C.clamp((world.player.pitch||0)+tilt*dt*.65*save.prefs.verticalSensitivity*(save.prefs.invertY?-1:1),-.35,.35);
         const a=world.player.angle,forward=-y,strafe=x;
         x=Math.cos(a)*forward-Math.sin(a)*strafe;y=Math.sin(a)*forward+Math.cos(a)*strafe;
       }else{x+=(keys.has('ArrowRight')?1:0)-(keys.has('ArrowLeft')?1:0);}
       world.update(dt,{x,y,sprint:sprint||keys.has('ShiftLeft')||keys.has('ShiftRight'),crouch});
       if(save.prefs.view==='3d'){world.player.fx=Math.cos(world.player.angle);world.player.fy=Math.sin(world.player.angle);}else if(world.player.moving)world.player.angle=Math.atan2(world.player.fy,world.player.fx);
       events();hurt=Math.max(0,hurt-dt);saveClock+=dt;if(saveClock>3){saveClock=0;archive();}
     }
     if(!scare&&(dirty||(!paused&&stamp-lastPaint>(save.prefs.view==='3d'?45:32)))){
       ctx.save();if(hurt&&save.prefs.motion)ctx.translate(Math.floor(Math.sin(stamp*.06)*hurt*3),0);
       if(save.prefs.view==='3d')A.renderFirst(ctx,world,view,skin(),time,save.prefs);else A.renderTop(ctx,world,map,view,skin(),time,save.prefs);
       ctx.restore();if(hurt){ctx.fillStyle='rgba(116,27,46,'+hurt*.3+')';ctx.fillRect(0,0,view.w,view.h);}dirty=false;lastPaint=stamp;
     }
     if(!paused&&stamp-lastHud>130){updateHud();lastHud=stamp;}audio.ambient(world,!paused&&!scare);
   }requestAnimationFrame(loop);
 }
 $('content').addEventListener('click',ev=>{
   const b=ev.target.closest('button');if(!b||b.disabled)return;audio.unlock();
   if(b.dataset.difficulty!==undefined){setup.seed=$('seed').value;setup.difficulty=+b.dataset.difficulty;show('setup',false);return;}
   if(b.dataset.view){setup.seed=$('seed').value;setup.view=b.dataset.view;show('setup',false);return;}
   if(b.dataset.mode){setup.seed=$('seed').value;setup.mode=b.dataset.mode;show('setup',false);return;}
   if(b.dataset.camera){camera(b.dataset.camera);archive();show('pause',false);return;}
   if(b.dataset.skin){
     const s=A.SKINS.find(s=>s.id===b.dataset.skin);if(!s)return;
     if(!save.owned.includes(s.id)){if(save.coins<s.cost){notify('YOU NEED '+(s.cost-save.coins)+' MORE COINS.');return;}save.coins-=s.cost;save.owned.push(s.id);audio.effect('buy');}
     save.selected=s.id;persist();show('wardrobe',false);return;
   }
   if(b.dataset.pref){const key=b.dataset.pref;save.prefs[key]=!save.prefs[key];audio.unlock();audio.sync();persist();show('settings',false);$('content').querySelector('[data-pref="'+key+'"]')?.focus({preventScroll:true});return;}
   const a=b.dataset.action;
   if(['wardrobe','guide','settings'].includes(a)){origin=world?(page==='tutorial'?'tutorial':'pause'):'home';archive();show(a);return;}
   if(['home','pause','journal','tutorial'].includes(a)){if(a==='home'&&world){leave();return;}archive();show(a);return;}
   if(a==='setup'){setup.view=save.prefs.view;show('setup');return;}
   if(a==='shuffle'){$('seed').value=String(seed());setup.seed=$('seed').value;return;}
   if(a==='start'){setup.seed=$('seed').value;start(hash(setup.seed),setup.difficulty,setup.mode,setup.view);return;}
   if(a==='continue'){
     try{run={...save.run};load(C.World.restore(run.world));resume();}
     catch{save.run=null;persist();show('home');notify('THIS EXPEDITION COULD NOT BE RESTORED.');}return;
   }
   if(a==='resume'){resume();return;}if(a==='leave'){leave();return;}
   if(a==='tutorial-done'){save.tutorial=true;persist();resume();return;}
   if(a==='next-floor'){nextFloor();return;}
   if(a==='retry'||a==='retry-seed'){const s=a==='retry-seed'?run.seed:seed();start(s,world.map.difficulty,run.mode,save.prefs.view);return;}
   if(a==='export'){archive();const blob=new Blob([JSON.stringify({format:'NightShiftBackup',save},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download='Maze-Runner-Night-Shift-backup.json';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1500);notify('BACKUP EXPORTED.');return;}
   if(a==='import'){$('fileinput').click();return;}
   if(a==='reset-camera'){Object.assign(save.prefs,{sensitivity:1,touchSensitivity:1,verticalSensitivity:1,fov:84,brightness:1,headBob:false,invertY:false});persist();visualSettings();show('settings',false);notify('CAMERA SETTINGS RESET. YOUR EXPEDITION IS SAFE.');return;}
   if(a==='center-look'){if(world){world.player.pitch=0;archive();dirty=true;notify('VERTICAL VIEW CENTERED.');}else notify('START AN EXPEDITION TO CENTER THE VIEW.');return;}
   if(a==='fullscreen'){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else document.documentElement.requestFullscreen().catch(()=>notify('FULLSCREEN IS UNAVAILABLE.'));return;}
 });
 $('content').addEventListener('input',ev=>{if(ev.target.id==='seed')setup.seed=ev.target.value;if(ev.target.matches('input[type=range][data-scale]')){const key=ev.target.id;save.prefs[key]=+ev.target.value/+ev.target.dataset.scale;$('pref-'+key+'-value').textContent=preferenceValue(key);if(key==='volume')audio.sync();visualSettings();persist();}});
 $('fileinput').addEventListener('change',async ev=>{const f=ev.target.files[0];if(!f)return;try{if(f.size>1200000)throw Error();const v=JSON.parse(await f.text());if(v.format!=='NightShiftBackup'||v.save?.version!==2)throw Error();save=clean(v.save);world=null;run=null;map=null;origin='home';persist();audio.sync();visualSettings();show('home');notify('BACKUP RESTORED.');}catch{notify('THIS IS NOT A VALID NIGHT SHIFT BACKUP.');}ev.target.value='';});
 $('quick-sound').onclick=()=>{save.prefs.sound=!save.prefs.sound;audio.unlock();audio.sync();persist();soundButton();};
 $('pause-btn').onclick=()=>{if(!paused){archive();show('pause');}};$('map-btn').onclick=()=>{if(!paused){archive();show('journal');}};
 $('touch-stone').onclick=()=>{audio.unlock();decoy();};$('touch-torch').onclick=()=>{audio.unlock();torch();};$('touch-crouch').onclick=()=>{if(!paused){crouch=!crouch;world.crouching=crouch;updateHud();}};$('touch-interact').onclick=()=>{audio.unlock();interact();};
 $('touch-run').addEventListener('pointerdown',ev=>{if(paused)return;ev.preventDefault();sprint=true;audio.unlock();ev.currentTarget.setPointerCapture(ev.pointerId);ev.currentTarget.classList.add('held');});
 for(const e of ['pointerup','pointercancel','lostpointercapture'])$('touch-run').addEventListener(e,()=>{sprint=false;$('touch-run').classList.remove('held');});
 const zone=$('joy-zone');
 zone.addEventListener('pointerdown',ev=>{if(paused||joy.id!==null)return;ev.preventDefault();joy.id=ev.pointerId;joy.cx=ev.clientX;joy.cy=ev.clientY;zone.setPointerCapture(ev.pointerId);audio.unlock();const r=zone.getBoundingClientRect(),b=$('joy-base'),s=b.offsetWidth;b.style.left=ev.clientX-r.left-s/2+'px';b.style.bottom=r.bottom-ev.clientY-s/2+'px';});
 zone.addEventListener('pointermove',ev=>{if(ev.pointerId!==joy.id||paused)return;ev.preventDefault();const dx=ev.clientX-joy.cx,dy=ev.clientY-joy.cy,d=Math.hypot(dx,dy),mul=d>37?37/d:1;joy.x=d<5?0:dx*mul/37;joy.y=d<5?0:dy*mul/37;$('joy-stick').style.transform='translate('+dx*mul+'px,'+dy*mul+'px)';});
 function joyEnd(ev){if(ev.pointerId===joy.id){joy.x=joy.y=0;joy.id=null;$('joy-stick').style.transform='';$('joy-base').style.left='';$('joy-base').style.bottom='';}}
 for(const e of ['pointerup','pointercancel','lostpointercapture'])zone.addEventListener(e,joyEnd);
 function lookStart(ev){if(paused||save.prefs.view!=='3d'||look.id!==null)return;ev.preventDefault();look.id=ev.pointerId;look.x=ev.clientX;look.y=ev.clientY;look.touch=ev.pointerType==='touch';ev.currentTarget.setPointerCapture(ev.pointerId);audio.unlock();}
 function lookMove(ev){if(paused||look.id!==ev.pointerId)return;const dx=ev.clientX-look.x,dy=ev.clientY-look.y,response=look.touch?save.prefs.touchSensitivity:save.prefs.sensitivity;look.x=ev.clientX;look.y=ev.clientY;world.player.angle+=dx*.006*response;world.player.pitch=C.clamp((world.player.pitch||0)-dy*.0035*response*save.prefs.verticalSensitivity*(save.prefs.invertY?-1:1),-.35,.35);world.player.fx=Math.cos(world.player.angle);world.player.fy=Math.sin(world.player.angle);}
 function lookEnd(ev){if(look.id===ev.pointerId)look.id=null;}
 for(const target of [$('world'),$('look-zone')]){
   target.addEventListener('pointerdown',lookStart);target.addEventListener('pointermove',lookMove);for(const e of ['pointerup','pointercancel','lostpointercapture'])target.addEventListener(e,lookEnd);
 }
 addEventListener('keydown',ev=>{
   if(ev.target.matches('input,select,textarea')||scare)return;
   if(world&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','PageUp','PageDown','Space','ShiftLeft','ShiftRight'].includes(ev.code))ev.preventDefault();
   if(ev.repeat){if(!paused)keys.add(ev.code);return;}
   if(ev.code==='Escape'||ev.code==='KeyP'){if(world){if(paused){if(page!=='tutorial')resume();}else{archive();show('pause');}}return;}
   if(paused)return;audio.unlock();keys.add(ev.code);
   if(ev.code==='KeyC'){crouch=!crouch;world.crouching=crouch;}
   if(ev.code==='KeyR'&&save.prefs.view==='3d'){world.player.pitch=0;dirty=true;}

 });
 addEventListener('keyup',ev=>keys.delete(ev.code));addEventListener('blur',()=>{reset();if(world&&!paused&&!scare){archive();show('pause',false);}});
